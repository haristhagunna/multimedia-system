<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Three media concepts</title><desc id="desc">Representation space, representation values and representation dimensions, as described in the course notes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Three media concepts</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Representation space, representation values and representation dimensions, as described in the course notes.</text>
<g ><rect x="55" y="170" width="345" height="205" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="227.5" y="267.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">REPRESENTATION SPACE</text><text x="227.5" y="297.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="227.5" dy="0">where media are presented</tspan><tspan x="227.5" dy="18.3">visual: paper/screen • acoustic: mono/stereo</tspan></text><rect x="440" y="170" width="345" height="205" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="612.5" y="267.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">REPRESENTATION VALUES</text><text x="612.5" y="297.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="612.5" dy="0">how information is represented</tspan><tspan x="612.5" dy="18.3">continuous: waves • discrete: characters</tspan></text><rect x="825" y="170" width="345" height="205" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="997.5" y="267.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">REPRESENTATION DIMENSIONS</text><text x="997.5" y="297.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="997.5" dy="0">space and time</tspan><tspan x="997.5" dy="18.3">spatial: 2-D/3-D • temporal: time dependence</tspan></text><text x="600" y="450" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f766e">Every medium defines these three concepts</text></g></svg>