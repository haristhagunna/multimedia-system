<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Linear and non-linear multimedia</title><desc id="desc">Linear follows a fixed order. Non-linear presentation lets the user choose a path, as in games and interactive video.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Linear and non-linear multimedia</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Linear follows a fixed order. Non-linear presentation lets the user choose a path, as in games and interactive video.</text>
<g ><rect x="65" y="165" width="480" height="275" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="305.0" y="297.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172554">LINEAR</text><text x="305.0" y="327.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" fill="#475569">fixed sequence; user cannot change order</text><rect x="115" y="275" width="90" height="75" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="160.0" y="318.62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">STEP 1</text><path d="M205,312 L250,312" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="255" y="275" width="90" height="75" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="300.0" y="318.62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">STEP 2</text><path d="M345,312 L390,312" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="395" y="275" width="90" height="75" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="440.0" y="318.62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">STEP 3</text><rect x="655" y="165" width="480" height="275" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="895.0" y="297.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172554">NON-LINEAR</text><text x="895.0" y="327.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" fill="#475569">interactive; user controls the path</text><rect x="690" y="285" width="115" height="70" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="747.5" y="326.12" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">START</text><rect x="930" y="235" width="145" height="65" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="1002.5" y="273.62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">CHOICE A</text><rect x="930" y="345" width="145" height="65" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/><text x="1002.5" y="383.62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#172554">CHOICE B</text><path d="M805,315 L920,267" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M805,325 L920,378" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>