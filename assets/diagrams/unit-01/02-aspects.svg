<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Aspects of multimedia</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Five aspects in the source notes: interactivity, integration, hyperlinking, user control and multisensory experience.</text>
<g ><rect x="55" y="205" width="195" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="152.5" y="272.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">INTERACTIVITY</text><text x="152.5" y="302.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">click, drag, enter</text><rect x="285" y="205" width="195" height="145" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="382.5" y="272.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">INTEGRATION</text><text x="382.5" y="302.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">media work together</text><rect x="515" y="205" width="195" height="145" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="612.5" y="272.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">HYPERLINKING</text><text x="612.5" y="302.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">content connected by links</text><rect x="745" y="205" width="195" height="145" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="842.5" y="272.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">USER CONTROL</text><text x="842.5" y="302.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">pause, play, skip</text><rect x="975" y="205" width="195" height="145" rx="16" fill="#fdf2f8" stroke="#be185d" stroke-width="2.5"/><text x="1072.5" y="272.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">MULTISENSORY</text><text x="1072.5" y="302.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">sight, hearing, touch</text><text x="600" y="440" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f766e">One cohesive, interactive multimedia experience</text></g></svg>