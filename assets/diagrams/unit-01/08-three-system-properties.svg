<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Three properties of a multimedia system</title><desc id="desc">Combination of media, independence and computer-supported integration. Keep these separate from the four characteristics.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Three properties of a multimedia system</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Combination of media, independence and computer-supported integration. Keep these separate from the four characteristics.</text>
<g ><rect x="65" y="185" width="340" height="190" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="235.0" y="275.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">COMBINATION OF MEDIA</text><text x="235.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">both discrete and continuous media are used</text><rect x="450" y="185" width="340" height="190" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="620.0" y="275.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">INDEPENDENCE</text><text x="620.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">media can be handled separately at different levels</text><rect x="835" y="185" width="340" height="190" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="1005.0" y="275.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">COMPUTER-SUPPORTED INTEGRATION</text><text x="1005.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">computer-controlled and programmable media processing</text><text x="600" y="450" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#c2410c">Properties ≠ the four system characteristics</text></g></svg>