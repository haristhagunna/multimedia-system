<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1580" height="780" viewBox="0 0 1580 780" role="img" aria-labelledby="title desc">
<title id="title">UNIT 1 — QUICK DRAW REVISION SHEET</title><desc id="desc">Hand-drawn-style memory map. Reproduce each small sketch from memory before the exam.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter></defs>
<rect width="1580" height="780" rx="22" fill="#fffdf7"/>
<text x="54" y="62" font-family="Segoe Print,Comic Sans MS,cursive" font-size="30" font-weight="750" fill="#172554">UNIT 1 — QUICK DRAW REVISION SHEET</text>
<text x="54" y="96" font-family="Segoe Print,Comic Sans MS,cursive" font-size="17" fill="#475569">Hand-drawn-style memory map. Reproduce each small sketch from memory before the exam.</text>
<g filter="url(#rough)"><g transform="rotate(-0.5 280.0 257.5)"><rect x="45" y="125" width="470" height="265" rx="13" fill="#fffef9" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/><text x="59" y="156" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#1d4ed8">1. FIVE ELEMENTS</text><text x="63" y="190" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#1d4ed8">Text • Audio • Graphics</text><text x="63" y="215" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#1d4ed8">Video • Animation</text></g><g transform="rotate(0.4 790.0 257.5)"><rect x="555" y="125" width="470" height="265" rx="13" fill="#fffef9" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><text x="569" y="156" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#0f766e">2. GLOBAL STRUCTURE</text><text x="573" y="190" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Application domain</text><text x="573" y="215" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">System domain</text><text x="573" y="240" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Device domain</text><text x="573" y="265" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Synchronization spans all</text></g><g transform="rotate(-0.3 1300.0 257.5)"><rect x="1065" y="125" width="470" height="265" rx="13" fill="#fffef9" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/><text x="1079" y="156" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#7c3aed">3. SIX MEDIA CATEGORIES</text><text x="1083" y="190" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#7c3aed">Perception • Representation</text><text x="1083" y="215" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#7c3aed">Presentation • Storage</text><text x="1083" y="240" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#7c3aed">Transmission • Information exchange</text></g><g transform="rotate(0.3 280.0 577.5)"><rect x="45" y="445" width="470" height="265" rx="13" fill="#fffef9" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/><text x="59" y="476" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#c2410c">4. THREE MEDIA CONCEPTS</text><text x="63" y="510" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#c2410c">Representation space</text><text x="63" y="535" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#c2410c">Representation values</text><text x="63" y="560" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#c2410c">Representation dimensions</text></g><g transform="rotate(-0.4 790.0 577.5)"><rect x="555" y="445" width="470" height="265" rx="13" fill="#fffef9" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/><text x="569" y="476" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#1d4ed8">5. MEDIA BY TIME</text><text x="573" y="510" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#1d4ed8">Discrete = time-independent</text><text x="573" y="535" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#1d4ed8">Continuous = time-dependent</text><text x="573" y="560" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#1d4ed8">Text / image vs audio / movie</text></g><g transform="rotate(0.5 1300.0 577.5)"><rect x="1065" y="445" width="470" height="265" rx="13" fill="#fffef9" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/><text x="1079" y="476" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="19" font-weight="700" fill="#0f766e">6. TRANSMISSION MODES</text><text x="1083" y="510" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Asynchronous = byte + gaps</text><text x="1083" y="535" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Synchronous = shared clock</text><text x="1083" y="560" text-anchor="start" font-family="Segoe Print,Comic Sans MS,cursive" font-size="15" font-weight="500" fill="#0f766e">Isochronous = fixed, steady rate</text></g></g></svg>