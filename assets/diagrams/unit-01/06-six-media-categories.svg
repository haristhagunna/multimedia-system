<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Six categories of media</title><desc id="desc">Use the central question to distinguish perception, representation, presentation, storage, transmission and information exchange.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Six categories of media</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Use the central question to distinguish perception, representation, presentation, storage, transmission and information exchange.</text>
<g ><rect x="55" y="145" width="345" height="145" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="227.5" y="212.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">PERCEPTION</text><text x="227.5" y="242.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="227.5" dy="0">How do humans perceive?</tspan><tspan x="227.5" dy="18.3">seeing • hearing</tspan></text><rect x="440" y="145" width="345" height="145" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="612.5" y="212.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">REPRESENTATION</text><text x="612.5" y="242.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="612.5" dy="0">How is data coded?</tspan><tspan x="612.5" dy="18.3">ASCII • JPEG • PCM • MPEG</tspan></text><rect x="825" y="145" width="345" height="145" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="997.5" y="212.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">PRESENTATION</text><text x="997.5" y="242.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="997.5" dy="0">Which input/output devices?</tspan><tspan x="997.5" dy="18.3">screen • speaker • camera</tspan></text><rect x="55" y="330" width="345" height="145" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/><text x="227.5" y="397.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">STORAGE</text><text x="227.5" y="427.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="227.5" dy="0">Where is it stored?</tspan><tspan x="227.5" dy="18.3">disk • CD-ROM • SSD</tspan></text><rect x="440" y="330" width="345" height="145" rx="16" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/><text x="612.5" y="397.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">TRANSMISSION</text><text x="612.5" y="427.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="612.5" dy="0">Over what is it sent?</tspan><tspan x="612.5" dy="18.3">coax • fibre • wireless</tspan></text><rect x="825" y="330" width="345" height="145" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2.5"/><text x="997.5" y="397.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">INFORMATION EXCHANGE</text><text x="997.5" y="427.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569"><tspan x="997.5" dy="0">Which carrier exchanges it?</tspan><tspan x="997.5" dy="18.3">storage + transmission</tspan></text></g></svg>