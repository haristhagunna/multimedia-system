<g ><rect x="435" y="150" width="330" height="90" rx="16" fill="#eff6ff" stroke="#7c3aed" stroke-width="2.5"/><text x="600.0" y="190.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">MULTIMEDIA APPLICATION</text><text x="600.0" y="220.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#475569">computer-controlled integration</text><rect x="45" y="355" width="190" height="105" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="140.0" y="402.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">TEXT</text><text x="140.0" y="432.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">characters &amp; symbols</text><path d="M600,240 L140,350" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="275" y="355" width="190" height="105" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><text x="370.0" y="402.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">AUDIO</text><text x="370.0" y="432.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">speech, effects, music</text><path d="M600,240 L370,350" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="505" y="355" width="190" height="105" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="600.0" y="402.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172554">GRAPHICS</text><text x="600.0" y="432.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">2-D figures &amp; illustrations</text><path d="M600,240 L600,350" fill="none" stroke="#7c3aed" stro