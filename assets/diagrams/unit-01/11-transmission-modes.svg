<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Asynchronous, synchronous and isochronous transmission</title><desc id="desc">Asynchronous: byte-level timing and gaps. Synchronous: shared clocks, no start/stop bits. Isochronous: fixed, steady rate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Asynchronous, synchronous and isochronous transmission</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Asynchronous: byte-level timing and gaps. Synchronous: shared clocks, no start/stop bits. Isochronous: fixed, steady rate.</text>
