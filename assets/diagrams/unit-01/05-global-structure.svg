<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Global structure of multimedia</title><desc id="desc">Three stacked domains with a vertical synchronization layer spanning all three.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Global structure of multimedia</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Three stacked domains with a vertical synchronization layer spanning all three.</text>
<g ><rect x="290" y="145" width="820" height="105" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="700.0" y="192.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172554">APPLICATION DOMAIN</text><text x="700.0" y="222.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">tools &amp; applications • documents • user interface • programming abstractions</text><rect x="290" y="280" width="820" height="105" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="700.0" y="327.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172554">SYSTEM DOMAIN</text><text x="700.0" y="357.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">database systems • operating systems • communication systems • computer technology</text><rect x="290" y="415" width="820" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="700.0" y="462.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172554">DEVICE DOMAIN</text><text x="700.0" y="492.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">storage • compression • network • sound • image/graphics • video/animation</text><rect x="65" y="145" width="165" height="375" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="147.5" y="327.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">SYNCHRONIZATION</text><text x="147.5" y="357.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">coordinates media in time across all three domains</text><path d="M230,330 L275,330" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/></g></svg>