<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Four characteristics of a multimedia system</title><desc id="desc">Computer controlled, integrated, digitally represented and interactive.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="#ffffff"/>
<text x="54" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172554">Four characteristics of a multimedia system</text>
<text x="54" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Computer controlled, integrated, digitally represented and interactive.</text>
<g ><rect x="70" y="160" width="500" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="320.0" y="217.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">COMPUTER-CONTROLLED</text><text x="320.0" y="247.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">computer manages each stage</text><rect x="625" y="160" width="500" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="875.0" y="217.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">INTEGRATED</text><text x="875.0" y="247.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">media combined in one system</text><rect x="70" y="335" width="500" height="125" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="320.0" y="392.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">DIGITALLY REPRESENTED</text><text x="320.0" y="422.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">analog converted to digital</text><rect x="625" y="335" width="500" height="125" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="875.0" y="392.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">INTERACTIVE</text><text x="875.0" y="422.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#475569">user controls time, order, speed</text></g></svg>